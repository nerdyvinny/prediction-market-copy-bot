# WHO WE COPY (`roster`) + the research tool's settings (everything else).
#
# The bot copies exactly the wallets listed under `roster` below. It does NOT
# discover, rank, or rotate leaders while it runs. Editing this list is how the
# lineup changes, and it takes effect on the next restart.
#
# Why selection is manual now
# ---------------------------
# 34 days of paper trading (2026-07-27..08-30, 115 closed round-trips) measured
# the premise the automatic funnel rested on, and it did not hold:
#
#   * corr(a leader's trailing ROI in OUR fills, their next trade's ROI) = -0.018
#   * after a POSITIVE record with us, the next trade returned -11.3% (n=30)
#   * after a NEGATIVE record with us, it returned  -9.6% (n=40)
#   * the funnel's picks did not beat copying every candidate (p=0.717)
#   * all three leaders with enough tape decayed first-half -> second-half
#
# It also churned 33 wallets through 8 seats in a month; 11 of them never
# produced a single trade. Nothing accumulated enough evidence to judge.
#
# So the ranking/vetting machinery no longer runs in the live loop. It survives
# as a research command — `pmbot leaders` — which prints ranked candidates for
# you to read. Nothing it prints is followed until you paste it into `roster`.
#
# Adding a wallet: run `pmbot leaders`, then `pmbot backtest --leaders 0x...`
# to see how it would actually have copied, then add the line.
# Removing a wallet: delete the line and restart. Positions you already hold
# from them become exit-only — their SELLs are still mirrored, their BUYs are
# ignored — so nothing is stranded.

roster:
  # Rebuilt 2026-09-02 from the wallet census (30/60/90-day runs over 962
  # wallets) plus `scripts/roster_arms.py`, which scores whole LINEUPS as
  # cohorts competing for the one $500 rather than scoring wallets alone.
  #
  # The size result is the load-bearing one, and it is monotone under two
  # independent selection rules -- by score and by sample size:
  #
  #     3 wallets  +42.7% / +25.6%      peak capital $330 / $413
  #     5 wallets  +27.0% / +18.0%      peak $698 / $804
  #     8 wallets  +16.7% / +12.6%      peak $868 / $1,197
  #    12 wallets  +13.0%               peak $1,294
  #    19 wallets   +9.8%               peak $1,018
  #
  # More leaders is worse, twice over: ROI falls and peak concurrent capital
  # climbs past the bankroll, so the larger lineups are spending money the bot
  # does not have. Concentration is the finding; there is no size to grow into.
  #
  # These three were picked by RULE, not by taking the highest backtest number.
  # Each clears the strict bar -- positive over 30, 60 AND 90 days and in both
  # NON-OVERLAPPING slices (days 30-60 and 60-90) -- on 100+ closed copies, so
  # the estimate is one you can believe. The "strict top 3" lineup scored
  # +42.7% but is the three highest-scoring wallets drawn from the same data
  # that scored them, which is the in-sample trap this repo keeps relearning.
  # This lineup scores +20.4% at a peak of $165, the only arm that fits $500.
  #
  # It is still selected on 90 days of history, and across 66 wallets a slice's
  # return correlated -0.168 with the next slice. Position caps, not these
  # numbers, are what limit the damage.
  - "0xc72d7dcdb23597d143a83536fb97b1d7db7efc21"   # HongYunX: +55.9%/100 copies, slices +51.3/+56.8, 153d tape
  - "0xf28e42d20e4826f2b10a24bc952001697947cab2"   # +13.4%/151, slices +9.6/+13.8, 265d tape (longest)
  - "0xe015b5a2a299167be835a2fd1e86f09c49e06ffd"   # TAIWANNUMBERONE: +9.8%/230, slices +9.8/+25.9, 210d

  # DROPPED 2026-09-02, with reasons:
  #   0x5cd5c8d7a1  -13.7% over 90d. The old allowlist pin; no longer earns it.
  #   0x455e565fda   -6.1%, negative at both 60 and 90 days.
  #   0xd487f513cf   +37.0% on NINE copies in 90 days. Unmeasurable, not good.
  #   0x9cdda449d7   +35.7% on 22. Same.
  #   0xcae693bcf9    +1.5% on 275. Real evidence of a real but tiny edge;
  #                   adding it back cost 2.2pp of roster ROI (+12.8 -> +10.5).
  #   0xff81cc8583    +7.4% on 402 -- the most reliable single estimate we have,
  #                   which is why it was added earlier today. But in a LINEUP
  #                   its volume crowds the bankroll: including it took the
  #                   roster from +20.4% to +13.6% and peak capital from $165 to
  #                   $870. Good wallet, wrong role. Solo quality and roster
  #                   contribution are not the same measurement.
  # All keep their open positions as exit-only: SELLs mirrored, BUYs ignored.

# ---------------------------------------------------------------------------
# Everything below this line feeds `pmbot leaders` ONLY. The live loop never
# reads it. It is kept because finding candidate wallets is still useful — it
# is deciding which ones are good, automatically and daily, that did not work.
# ---------------------------------------------------------------------------

selection:
  top_n: 8                     # diversify across up to this many leaders
  rescore_interval_hours: 24   # re-rank the pool on this cadence

  # top_n is a RELATIVE cut, and it binds on every rescore (the eligible pool
  # ran 9-27, median 15, over the first month). That evicted leaders which had
  # got no worse: 0xc23dc0ec passed vetting on 2026-08-20 with the most
  # copyable tape of any wallet, then vanished the next day when the pool grew
  # 19 -> 27. Nothing rejected it; it was simply out-ranked.
  #
  # With keep_incumbents on, a leader we already follow keeps its seat. It
  # still has to clear every filter below AND the copy vetting, so a seat is
  # only ever lost by failing a test -- never by someone else's good day.
  keep_incumbents: true
  explore_slots: 2             # seats kept contestable so the funnel still
                               # discovers; incumbency can claim at most
                               # top_n - explore_slots.

  # Copyable BUYs that count as "enough of this tape is mirrorable". The
  # copyability weight saturates here instead of rewarding raw volume: the
  # highest-copyable wallet of the first month (235) was also the worst
  # leader we followed, so more is not better past a point.
  copyable_target: 40

  # realized_pnl is still POOL-RELATIVE (min-max), unlike win_rate and
  # copyability. That is a known wart: one whale flattens the field (on a live
  # pool spanning $1.5k-$56k every other wallet scored below 0.20), and a
  # wallet is re-scored when only the pool changed (max drift 0.037, larger
  # than several adjacent rank gaps).
  #
  # A log-spaced absolute scale is implemented and tested (`pnl_score`), and it
  # fixes both -- set these two to switch to it. It is OFF because it measured
  # WORSE where it counts. Correlation of rank with trades we actually filled:
  #     Aug-26 lineup  +0.03 -> +0.21   (better)
  #     Aug-23 lineup  +0.08 -> -0.63   (much worse)
  # On Aug-23 it drops 0x5cd5c8d7 from 2nd to LAST -- the wallet that supplied
  # 25 of that month's 91 buys, and the smallest P&L in the pool.
  #
  # The reason is the finding, not the scale: over the 10 wallets we have both
  # readings for, corr(realized_pnl, buys we filled) is **-0.035**. Dollar P&L
  # does not predict what we can copy, because it tracks a leader's bankroll,
  # and the wallet we copy most is small. Min-max was accidentally hiding that
  # by squashing everyone under the whale; making the term faithful exposes it.
  # Sweeping the anchors only confirms it -- the sole setting that does not hurt
  # ($5000 floor) works by re-flattening the field, i.e. by doing less.
  #
  # So the real question is the WEIGHT on realized_pnl, not its normalisation.
  # Do not tune that here: 2 lineups and 10 wallets is nowhere near enough, and
  # this repo has a history of changes that looked right and failed live.
  pnl_floor_usd: 0        # e.g. 1000  } both must be set,
  pnl_target_usd: 0       # e.g. 50000 } and target > floor

# A wallet must pass ALL of these to be eligible. One 30-day window covers
# everything — recent form only, no credit for ancient history.
filters:
  lookback_days: 30
  min_trades: 50                    # ≥50 trades in the window (alive + active)
  min_resolved_markets: 25          # ≥25 FINISHED bets behind the win rate —
                                    # 80% of 2 is luck; 80% of 25 is a signal
  min_win_rate: 0.80                # over resolved markets, always enforced
  min_realized_pnl_usd: 0           # must be net-positive in the window
  min_distinct_categories: 1        # 1 = single-market specialists welcome
  max_profit_concentration: 0.40    # no market may be >40% of total profit
  max_hours_since_last_trade: 96    # dead-account guard (was 48; widened to
                                    # readmit e.g. sports bettors between
                                    # game days — biggest reject bucket)
  min_copyable_trades: 5            # ≥5 BUYs the copy side would actually
                                    # mirror (≥$500 notional, in price band) —
                                    # filters out uncopyable penny-bet bots
  min_tape_span_days: 7             # HFT guard: if the ~1500-trade tape we
                                    # fetch is FULL yet covers under 7 days,
                                    # the wallet fires hundreds of trades/day —
                                    # a latency bot (in-game sports sniper /
                                    # market maker). Its win rate is speed we
                                    # can't inherit at a 10s poll, and so
                                    # shallow a tape can't be vetted anyway.

# Ranking weights for eligible wallets (should sum to ~1.0). Consistency
# (category spread) is zeroed: with specialists allowed it mostly punishes
# exactly the profile we now want.
#
# 2026-08-23, from 37 rescores of live data: the old weights ranked wallets on
# how rich they are, which barely predicts whether we get to copy them. The
# score's correlation with trades we actually filled was +0.13; the count of
# copyable trades scored +0.35. The top-ranked wallet held its seat for 76% of
# the month and produced TWO fills, while the wallets behind 46% of all buys
# ranked 7th and 17th. `copyability` exists to close that gap -- it is the one
# term measured on an absolute scale, so it does not drift with the pool.
weights:
  realized_pnl: 0.25
  win_rate: 0.25
  consistency: 0.00
  recency: 0.20
  copyability: 0.30

# Manual overrides (optional). Allowlisted wallets bypass BOTH the selection
# filters above and the copy-vetting backtest — they are followed on your say-so
# until you remove them, so review them when you review the lineup.
allowlist:
  # Dropped 2026-08-12 by the out-of-sample vetting rule on a -$17.13 older
  # window, on the same day its recent window hit its best-ever +$127.75. It
  # was the source of 13 of the bot's fills over Aug 8-10 and its trades clear
  # the entry filters better than anything except 0xc23dc0ec. The rule that
  # dropped it has since been given slack (copy_vet_oos_min_pnl_usd), but this
  # pin keeps it in regardless of what the sliding window does next.
  - "0x5cd5c8d7a17c78d7389d8b87b611aed83322ac33"
blocklist: []   # wallet addresses to never follow
