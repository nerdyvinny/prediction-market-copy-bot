# Confirmed cross-venue market pairs for Strategy #1 (Polymarket <-> Kalshi).
#
# ONLY pairs listed under `pairs:` are ever traded. `pmbot arb-scan --suggest`
# prints ready-to-paste stubs discovered by fuzzy matching — but before moving
# one here, READ BOTH MARKETS' RESOLUTION RULES and confirm they resolve
# identically (same data source, same deadline, same edge cases). A pair that
# resolves differently turns "risk-free" arb into two naked positions.
#
# Fields:
#   pm_market_id   Polymarket condition id (0x...)
#   kalshi_ticker  Kalshi market ticker (e.g. KXHIGHNY-26JUL04-T98)
#   pm_outcome     Polymarket outcome label the pair refers to (default "Yes")
#   aligned        true  -> PM outcome == Kalshi YES  (same event direction)
#                  false -> PM outcome == Kalshi NO   (venues word it inversely)
#   note           free text (kept for audit trail)
#
# Example:
#   pairs:
#     - pm_market_id: "0xabc123..."
#       kalshi_ticker: "KXPRES-28-DEM"
#       pm_outcome: "Yes"
#       aligned: true
#       note: "Both resolve on AP call; checked 2026-07-03"

pairs: []

